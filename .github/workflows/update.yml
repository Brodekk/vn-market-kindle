name: update
on:
  schedule:
    # 08:00-15:55 giờ Việt Nam (UTC+7), thứ 2 đến thứ 6, mỗi 5 phút
    - cron: '*/5 1-8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy số liệu và dựng trang
        run: python3 fetch_data.py
      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || (git commit -m "cập nhật $(date -u +%H:%M)" && git push)
